<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1C4592" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WorkTracker" />
  <title>WorkTracker — Proagrar</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">

  <div class="login-wrap">
    <div class="login-card">

      <div class="login-logo">
        <div class="login-logo-icon">
          <img src="icons/icon.svg" alt="WorkTracker" width="64" height="64" />
        </div>
        <h1 class="login-title">WorkTracker</h1>
        <p class="login-sub">Proagrar — Evidenca dela</p>
      </div>

      <div class="oauth-buttons">
        <button id="googleBtn" class="btn-oauth">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M19.6 10.23c0-.68-.06-1.36-.18-2H10v3.78h5.4a4.62 4.62 0 0 1-2 3.03v2.5h3.24c1.9-1.75 2.96-4.33 2.96-7.31z" fill="#4285F4"/>
            <path d="M10 20c2.7 0 4.97-.9 6.63-2.44l-3.24-2.51c-.9.6-2.04.96-3.39.96-2.6 0-4.81-1.76-5.6-4.12H1.07v2.6A10 10 0 0 0 10 20z" fill="#34A853"/>
            <path d="M4.4 11.89A6.02 6.02 0 0 1 4.09 10c0-.66.12-1.3.31-1.89V5.51H1.07A10 10 0 0 0 0 10c0 1.61.39 3.13 1.07 4.49l3.33-2.6z" fill="#FBBC05"/>
            <path d="M10 3.96c1.47 0 2.79.5 3.82 1.5l2.86-2.86C14.96.99 12.69 0 10 0A10 10 0 0 0 1.07 5.51l3.33 2.6C5.19 5.72 7.4 3.96 10 3.96z" fill="#EA4335"/>
          </svg>
          Prijava z Google
        </button>

        <div class="oauth-divider">ali</div>

        <button id="facebookBtn" class="btn-oauth btn-oauth--facebook">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="white" aria-hidden="true">
            <path d="M20 10a10 10 0 1 0-11.56 9.87v-6.99H5.9V10h2.54V7.8c0-2.5 1.49-3.89 3.77-3.89 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V10h2.77l-.44 2.88h-2.33v6.99A10 10 0 0 0 20 10z"/>
          </svg>
          Prijava s Facebook
        </button>
      </div>

      <div class="oauth-divider">ali</div>

      <form id="loginForm" class="login-form" novalidate>
        <div class="field" id="fullNameField" hidden>
          <label class="field-label" for="fullName">Ime in priimek</label>
          <input class="field-input" type="text" id="fullName" autocomplete="name" />
        </div>
        <div class="field" id="emailField">
          <label class="field-label" for="email">E-pošta</label>
          <input class="field-input" type="email" id="email" autocomplete="email" required />
        </div>
        <div class="field" id="passwordField">
          <label class="field-label" id="passwordLabel" for="password">Geslo</label>
          <input class="field-input" type="password" id="password" autocomplete="current-password" required />
        </div>
        <div class="field" id="confirmPasswordField" hidden>
          <label class="field-label" id="confirmPasswordLabel" for="confirmPassword">Potrdi geslo</label>
          <input class="field-input" type="password" id="confirmPassword" autocomplete="new-password" />
        </div>
        <button id="loginBtn" class="btn btn-primary" type="submit">
          <span class="btn-label">Prijava</span>
          <span class="btn-spinner" hidden aria-hidden="true"></span>
        </button>
      </form>

      <div class="login-actions">
        <button type="button" id="authToggleLink" class="btn btn-secondary btn-sm btn-block">Nimam računa? Registracija →</button>
        <button type="button" id="forgotPasswordLink" class="btn btn-secondary btn-sm btn-block">Pozabljeno geslo?</button>
      </div>

      <div id="loginSuccess" class="alert alert-success" hidden role="status"></div>
      <div id="loginError"   class="alert alert-error"   hidden role="alert"></div>

    </div>
  </div>

  <script type="module" src="auth.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>

</body>
</html>
